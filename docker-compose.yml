services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gobang-backend
    ports:
      - "${PORT:-5001}:5001"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-5001}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_DB=${REDIS_DB:-0}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:8080}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gobang-frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    restart: unless-stopped

# Redis 服务已存在，无需重复创建
# 如需在此创建 Redis，取消注释下面配置：
# redis:
#   image: redis:latest
#   container_name: redis
#   restart: always
