<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>五子棋在线</title>
  <link rel="stylesheet" href="/css/style.css?v=2.0">
</head>

<body class="pre-init">
  <script>
    (function () {
      var path = window.location.pathname;
      var isRoom = path === '/room' || path === '/room/' || /^\/room\/[A-Z0-9]{6}$/i.test(path);
      document.body.dataset.initialMode = isRoom ? 'multiplayer' : 'ai';
    })();
  </script>
  <!-- 顶部导航 -->
  <header class="navbar">
    <div class="logo">五子棋</div>
    <div class="nav-center">
      <button class="nav-btn" data-mode="ai">人机对战</button>
      <button class="nav-btn" data-mode="multiplayer">玩家对战</button>
    </div>
    <div class="nav-right">
      <button class="theme-toggle" id="themeToggle" title="切换主题">
        <span class="theme-icon">◐</span>
      </button>
    </div>
  </header>

  <!-- 主内容区 -->
  <main class="main-content">
    <!-- 房间面板（已弃用，保留用于兼容性） -->
    <div class="room-panel" id="roomPanel" style="display: none;"></div>

    <!-- 游戏区域 -->
    <div class="game-container">
      <!-- 手机端标题 -->
      <div class="mobile-header">
        <h1 class="mobile-title">五子棋</h1>
      </div>

      <!-- 手机端导航 -->
      <div class="mobile-nav">
        <button class="mobile-nav-btn" data-mode="ai">人机对战</button>
        <button class="mobile-nav-btn" data-mode="multiplayer">玩家对战</button>
      </div>
      <!-- 侧边信息面板 -->
      <aside class="side-panel" id="sidePanel">
        <div class="side-panel-main">
          <div class="side-panel-header">
            <h1 class="game-title">五子棋</h1>
          </div>
          <div class="player-info">
            <div class="player-card" id="playerCard">
              <div class="player-stone black"></div>
              <div class="player-status">
                <span class="player-label">你 (黑方)</span>
                <span class="player-turn" id="yourTurn">你的回合</span>
              </div>
            </div>
            <div class="player-card opponent" id="opponentCard">
              <div class="player-stone white"></div>
              <div class="player-status">
                <span class="player-label">AI (白方)</span>
                <span class="player-turn" id="opponentTurn">对方回合</span>
              </div>
            </div>
          </div>

          <div class="game-info">
            <div class="info-row">
              <span>当前回合:</span>
              <span id="currentTurn">黑方</span>
            </div>
            <div class="info-row mode-display">
              <span>对局模式:</span>
              <span id="gameMode">人机对战</span>
            </div>
          </div>

          <!-- 统一控制区域：包含游戏操作、对战选择、房间信息 -->
          <div class="control-area">
            <div class="game-actions" id="gameActions">
              <button class="btn-action" id="undoBtn" disabled>悔棋</button>
              <button class="btn-action" id="restartBtn" disabled>重新开始</button>
            </div>

            <!-- 玩家对战选择 -->
            <div class="multiplayer-select" id="multiplayerSelect" style="display: none;">
              <div class="game-actions multiplayer-actions">
                <button class="btn-action" id="createRoomBtn">创建新房间</button>
                <button class="btn-action" id="showJoinBtn">加入房间</button>
              </div>
              <div class="join-input-section" id="joinInputSection" style="display: none; margin-top: 8px;">
                <div style="display: flex; gap: 6px;">
                  <input type="text" id="roomIdInputPanel" placeholder="输入房间号" maxlength="6"
                    style="flex: 1; padding: 6px 10px; background-color: var(--bg-primary); border: 1px solid var(--border-color); border-radius: var(--radius); color: var(--text-primary); font-size: 13px; text-transform: uppercase; letter-spacing: 2px; text-align: center;">
                  <button class="btn-primary" id="joinRoomBtnPanel"
                    style="padding: 6px 12px; font-size: 12px;">加入</button>
                </div>
              </div>
            </div>

            <!-- 房间信息 (已移入 control-area) -->
            <div class="room-info-section" id="roomInfoSection" style="display: none;">
              <!-- 房间操作栏：房间号 + 邀请链接 + 离开房间 -->
              <div class="room-action-bar">
                <div class="room-id-box">
                  <span class="room-label">房间</span>
                  <span class="room-code" id="displayRoomId">------</span>
                </div>
                <div class="room-actions">
                  <button class="btn-icon" id="copyRoomId" title="复制房间号">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                      <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                    </svg>
                  </button>
                  <button class="btn-icon" id="toggleInviteLink" title="邀请链接">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                      <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
                    </svg>
                  </button>
                  <button class="btn-icon btn-leave" id="leaveRoomBtn" title="离开房间">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                      <polyline points="16 17 21 12 16 7"></polyline>
                      <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                  </button>
                </div>
              </div>

              <!-- 邀请链接展开区域 (悬浮显示) -->
              <div class="invite-section" id="inviteSection" style="display: none;">
                <div class="invite-link-row">
                  <input type="text" id="inviteLink" readonly placeholder="邀请链接">
                  <button class="btn-copy" id="copyInviteLink">复制</button>
                </div>
                <p class="waiting-text">等待对手加入...</p>
              </div>

              <!-- 准备状态 (紧凑显示) -->
              <div class="ready-section" id="readySection" style="display: none;">
                <div class="ready-status-row" style="display: none;"> <!-- 隐藏详细状态文本，靠按钮状态 -->
                  <span class="ready-label">你的状态:</span>
                  <span class="ready-value" id="myReadyStatus">未准备</span>
                </div>
                <div class="ready-status-row" style="display: none;">
                  <span class="ready-label">对手状态:</span>
                  <span class="ready-value" id="opponentReadyStatus">未准备</span>
                </div>
                <button class="btn-primary" id="readyBtn">准备开始</button>
              </div>
            </div>
          </div>
        </div>
      </aside>

      <!-- 棋盘区域 -->
      <div class="board-wrapper">
        <canvas id="board"></canvas>
      </div>

      <!-- 右侧装饰面板 -->
      <aside class="decor-panel">
        <div class="decor-section">
          <h3>🎮 游戏规则</h3>
          <p>双方轮流落子，先连成五子者获胜。黑方先手。</p>
        </div>

        <div class="decor-section">
          <h3>💡 游戏提示</h3>
          <ul class="game-tips">
            <li>占据中心位置获得更多进攻机会</li>
            <li>注意防守对手的连子</li>
            <li>活三、活四是制胜关键</li>
          </ul>
        </div>

        <div class="decor-section">
          <h3>📊 游戏统计</h3>
          <div class="stats-grid">
            <div class="stat-item">
              <span class="stat-value" id="totalGames">0</span>
              <span class="stat-label">总场次</span>
            </div>
            <div class="stat-item">
              <span class="stat-value" id="winGames">0</span>
              <span class="stat-label">胜利</span>
            </div>
            <div class="stat-item">
              <span class="stat-value" id="winRate">0%</span>
              <span class="stat-label">胜率</span>
            </div>
            <div class="stat-item">
              <span class="stat-value" id="totalMoves">0</span>
              <span class="stat-label">总步数</span>
            </div>
          </div>
          <button class="btn-action" id="resetStatsBtn" style="width: 100%; margin-top: 12px;">重置统计</button>
        </div>
      </aside>
    </div>
  </main>

  <!-- 结果弹窗 -->
  <div class="modal" id="resultModal" style="display: none;">
    <div class="modal-content">
      <h2 id="resultTitle">游戏结束</h2>
      <p id="resultMessage">黑方获胜</p>
      <div class="modal-actions">
        <button class="btn-primary" id="restartGameBtn">再来一局</button>
        <button class="btn-secondary" id="backHomeBtn">返回主页</button>
      </div>
    </div>
  </div>

  <!-- 确认弹窗 -->
  <div class="modal" id="confirmModal" style="display: none;">
    <div class="modal-content">
      <h2 id="confirmTitle">确认</h2>
      <p id="confirmMessage">确定要悔棋吗？</p>
      <div class="modal-actions">
        <button class="btn-primary" id="confirmYesBtn">确定</button>
        <button class="btn-secondary" id="confirmNoBtn">取消</button>
      </div>
    </div>
  </div>

  <!-- 通知弹窗 -->
  <div class="toast" id="toast" style="display: none;">
    <span id="toastMessage"></span>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/socket.js?v=1.4"></script>
  <script src="/js/game.js?v=1.4"></script>
  <script src="/js/ui.js?v=1.4"></script>
</body>

</html>
